[target.aarch64-unknown-linux-gnu]
# Use default cross image for better compatibility
pre-build = [
    "apt-get update",
    "apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev"
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "GITHUB_ACTIONS",
    "GITHUB_REF", 
    "GITHUB_SHA",
    "CARGO_TERM_COLOR"
]

[build]
default-target = "x86_64-unknown-linux-gnu"

[build.env]
passthrough = [
    "CARGO_TERM_COLOR"
]
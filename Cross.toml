[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y pkg-config libssl-dev:arm64 libglib2.0-dev:arm64 libgtk-3-dev:arm64 libx11-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 libgl1-mesa-dev:arm64"
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "GITHUB_ACTIONS",
    "GITHUB_REF", 
    "GITHUB_SHA",
    "CARGO_TERM_COLOR"
]
PKG_CONFIG_PATH = "/usr/lib/aarch64-linux-gnu/pkgconfig"
PKG_CONFIG_ALLOW_CROSS = "1"
OPENSSL_STATIC = "1"
OPENSSL_DIR = "/usr"

[build]
default-target = "x86_64-unknown-linux-gnu"

[build.env]
passthrough = [
    "CARGO_TERM_COLOR"
]
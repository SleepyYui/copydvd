[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/cross:aarch64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "GITHUB_ACTIONS",
    "GITHUB_REF",
    "GITHUB_SHA",
    "CARGO_TERM_COLOR"
]

[build]
default-target = "x86_64-unknown-linux-gnu"

[build.env]
passthrough = [
    "CARGO_TERM_COLOR"
]
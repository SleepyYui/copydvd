[package]
name = "dvd_ripper"
version = "0.1.0"
edition = "2021"
authors = ["DVD Ripper Team"]
description = "A multi-threaded DVD ripping application with GUI and CLI support"

[features]
default = ["gui"] # Ensures 'gui' feature is active by default
gui = ["iced", "iced_native", "iced_futures", "rfd"]

[dependencies]
# Core functionality
tokio = { version = "1.28", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.3", features = ["derive"] }
regex = "1.8"
chrono = "0.4"
directories = "5.0"
lazy_static = "1.4"
num_cpus = "1.16"
env_logger = "0.11.8"

# Filesystem
walkdir = "2.3"
tempfile = "3.6"

# Process management
which = "4.4"

# GUI (optional)
iced = { version = "0.9", features = ["tokio", "image", "canvas"], optional = true }
iced_native = { version = "0.10", optional = true }
iced_futures = { version = "0.6", optional = true }
rfd = { version = "0.11", optional = true }

# Platform-specific
[target.'cfg(windows)'.dependencies]
winreg = "0.51"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.26", features = ["mount", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "dvd_ripper"
path = "src/main.rs"

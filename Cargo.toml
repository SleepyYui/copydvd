[package]
name = "copy_dvd"
version = "0.1.5"
edition = "2021"
authors = ["SleepyYui"]
description = "A multi-threaded DVD copying application with GUI and CLI support - copy DVDs to MP4 and other formats"

[features]
default = ["gui"] # Ensures 'gui' feature is active by default
gui = ["eframe", "egui", "egui_extras", "rfd"]

[dependencies]
# Core functionality
tokio = { version = "1.28", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.3", features = ["derive"] }
regex = "1.8"
chrono = "0.4"
directories = "5.0"
lazy_static = "1.4"
num_cpus = "1.16"
env_logger = "0.11.8"

# Filesystem
walkdir = "2.3"
tempfile = "3.6"

# Process management
which = "4.4"

# HTTP and archive handling for HandBrake CLI management
reqwest = { version = "0.11", features = ["stream", "json", "rustls-tls"], default-features = false }
futures-util = "0.3"
bytes = "1.0"
zip = "0.6"
sha2 = "0.10"

# OS notifications
notify-rust = "4.8"

# Additional GUI dependencies
webbrowser = "1.0"
open = "5.0"
arboard = "3.2"

# GUI (optional)
eframe = { version = "0.28", optional = true }
egui = { version = "0.28", optional = true }
egui_extras = { version = "0.28", features = ["all_loaders"], optional = true }
rfd = { version = "0.11", optional = true }

# Fix for async-process rustix dependency issue
rustix = { version = "1.0.7", features = ["process"] }

# Platform-specific
[target.'cfg(windows)'.dependencies]
winreg = "0.51"
winapi = { version = "0.3", features = ["fileapi", "winbase"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.26", features = ["mount", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "copydvd"
path = "src/main.rs"

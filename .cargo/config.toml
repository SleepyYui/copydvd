[build]
# Use more CPU cores for parallel compilation
# jobs = 0 causes issues, let Cargo auto-detect instead

# Workaround for cross compilation static reference warnings
[env]
RUSTFLAGS = "-A static-mut-refs"

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.x86_64-apple-darwin]
# Use native macOS linker (faster than GNU ld)

[target.aarch64-apple-darwin]
# Use native macOS linker (faster than GNU ld)

# Speed up builds by using more efficient linker when available
[net]
offline = false
name: PR Summary

on:
  pull_request:
    types: [opened, synchronize]
    branches: [v2]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-summary:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    if: github.head_ref == 'v2-dev' && github.base_ref == 'v2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          echo "files<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only origin/${{ github.base_ref }}...origin/${{ github.head_ref }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get commit messages
        id: commits
        run: |
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          git log --oneline origin/${{ github.base_ref }}..origin/${{ github.head_ref }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate PR summary with Copilot
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = `${{ steps.changed-files.outputs.files }}`;
            const commitMessages = `${{ steps.commits.outputs.messages }}`;
            
            // Create a comprehensive summary request
            const summaryPrompt = `Please analyze this pull request and provide a comprehensive summary:
            
            ## Changed Files:
            ${changedFiles}
            
            ## Commit Messages:
            ${commitMessages}
            
            Please provide:
            1. **Summary**: Brief overview of what this PR accomplishes
            2. **Key Changes**: Main technical changes made
            3. **Impact**: Potential impact on the application
            4. **Testing**: Recommendations for testing these changes
            5. **Risk Assessment**: Any potential risks or considerations
            
            Format the response in clean markdown.`;
            
            try {
              // Get the PR diff for more context
              const { data: prFiles } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              
              let diffSummary = "## File Changes:\n";
              prFiles.forEach(file => {
                diffSummary += `- **${file.filename}** (${file.status}): +${file.additions}/-${file.deletions}\n`;
              });
              
              const enhancedPrompt = summaryPrompt + "\n\n" + diffSummary;
              
              // Post the summary as a comment
              const comment = `## 🤖 AI-Generated PR Summary
              
${enhancedPrompt}

---

**Note**: This summary was generated automatically. Please review the actual changes for complete accuracy.

**Changed Files**: ${prFiles.length} files modified
**Total Changes**: +${prFiles.reduce((acc, f) => acc + f.additions, 0)}/-${prFiles.reduce((acc, f) => acc + f.deletions, 0)}`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
              return "Summary posted successfully";
              
            } catch (error) {
              console.error('Error generating summary:', error);
              
              // Fallback to basic summary
              const fallbackComment = `## 📋 PR Summary (v2-dev → v2)
              
**Changed Files** (${changedFiles.split('\n').filter(f => f.trim()).length}):
\`\`\`
${changedFiles}
\`\`\`

**Recent Commits**:
\`\`\`
${commitMessages}
\`\`\`

**Analysis**: This PR contains changes from the development branch ready for production release.

---
*Generated automatically for v2-dev → v2 pull requests*`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fallbackComment
              });
              
              return "Fallback summary posted";
            }
name: Automatic Version Bump

on:
  push:
    branches: [main, master, v2]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always

jobs:
  version-bump:
    name: Automatic Version Bump
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip version]') && !contains(github.event.head_commit.message, '[version skip]')"
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Determine version bump type
        id: bump_type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Analyzing commit message: $COMMIT_MSG"
          
          # Check for breaking changes (major bump)
          if echo "$COMMIT_MSG" | grep -qE "(BREAKING CHANGE|!:|feat!|fix!|perf!)"; then
            BUMP_TYPE="major"
          # Check for features (minor bump)
          elif echo "$COMMIT_MSG" | grep -qE "^feat(\(.+\))?:"; then
            BUMP_TYPE="minor"
          # Check for fixes, docs, style, refactor, test, chore (patch bump)
          elif echo "$COMMIT_MSG" | grep -qE "^(fix|docs|style|refactor|perf|test|chore)(\(.+\))?:"; then
            BUMP_TYPE="patch"
          # Check for other common patterns
          elif echo "$COMMIT_MSG" | grep -qiE "(bug|hotfix|patch|update|improve|enhance|optimize)"; then
            BUMP_TYPE="patch"
          else
            BUMP_TYPE="patch"
          fi
          
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Bump type determined: $BUMP_TYPE"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"
          
          # Split version into parts
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          case $BUMP_TYPE in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Check if version needs updating
        id: version_check
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping update"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Version needs update: $CURRENT_VERSION → $NEW_VERSION"
          fi

      - name: Update Cargo.toml
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          echo "Updated Cargo.toml to version $NEW_VERSION"

      - name: Update Cargo.lock
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          cargo check --quiet
          echo "Updated Cargo.lock"

      - name: Commit version bump
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add Cargo.toml Cargo.lock
          
          # Create commit message with emoji based on bump type
          case $BUMP_TYPE in
            "major")
              EMOJI="🔥"
              TYPE_DESC="MAJOR"
              ;;
            "minor")
              EMOJI="✨"
              TYPE_DESC="MINOR"
              ;;
            "patch")
              EMOJI="🐛"
              TYPE_DESC="PATCH"
              ;;
          esac
          
          git commit -m "$EMOJI chore: bump version to $NEW_VERSION ($TYPE_DESC) [skip version]"
          echo "Created commit for version bump"

      - name: Create git tag
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          git tag "v$NEW_VERSION"
          echo "Created tag v$NEW_VERSION"

      - name: Push changes
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          git push origin ${{ github.ref_name }}
          git push origin --tags
          echo "Pushed version bump and tags"

      - name: Summary
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"
          
          echo "🎉 Version bump complete!"
          echo "📦 Version: $CURRENT_VERSION → $NEW_VERSION"
          echo "🏷️ Tag: v$NEW_VERSION"
          echo "🔄 Bump type: $BUMP_TYPE"

      - name: No update needed
        if: steps.version_check.outputs.needs_update == 'false'
        run: |
          echo "ℹ️ No version update needed"
          echo "Current version: ${{ steps.current_version.outputs.version }}"
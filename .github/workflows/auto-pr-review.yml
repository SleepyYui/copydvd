name: Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [v2]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-review:
    name: Auto-Generate Copilot Review
    runs-on: ubuntu-latest
    if: github.head_ref == 'v2-dev' && github.base_ref == 'v2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-trigger Copilot PR Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🤖 Triggering automatic Copilot PR review..."
          
          # Try to use GitHub CLI to trigger Copilot summary
          if gh extension list | grep -q copilot; then
            echo "Copilot CLI extension found, generating summary..."
            gh pr review ${{ github.event.number }} --body "Auto-requested Copilot review for v2-dev → v2 production release" || echo "Direct review failed"
          fi
          
          # Always post a comment to trigger Copilot attention
          gh pr comment ${{ github.event.number }} --body "## 🤖 Auto-Review Request (v2-dev → v2)

This PR is ready for production release. 

@github-copilot please analyze this pull request and provide:
- **Summary** of changes and their purpose
- **Impact assessment** on the application  
- **Risk analysis** for production deployment
- **Testing recommendations** before merge

**Context**: This is a v2-dev → v2 merge for production release.

---
*Automatically triggered for production deployment review*"

          echo "✅ Auto-review request posted"
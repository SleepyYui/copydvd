# .github/workflows/automated-release-pipeline.yml
name: Automated Build, Version, and Release Pipeline

on:
  push:
    branches:
      - v2 # Or your main development branch, e.g., main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if "RELEASE" keyword is not in commit message (uses latest commit)'
        required: false
        default: false
        type: boolean
      specific_version:
        description: "Manually specify a version for this release (e.g., 2024.06.03-manual). Overrides automatic versioning."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable # Or your preferred Rust version

jobs:
  # Job 1: Determine if a release should occur and calculate the version
  determine-version:
    name: Determine Version and Release Trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_release.outputs.should_release }}
      new_version: ${{ steps.calculate_version.outputs.new_version }}
      is_forced_release: ${{ github.event.inputs.force_release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to get commit messages

      - name: Check for RELEASE keyword or manual trigger
        id: check_release
        run: |
          # Check commit message of the latest commit on the pushed branch
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Latest commit message: $COMMIT_MSG"
          SHOULD_RELEASE="false"
          if [[ "$COMMIT_MSG" == *"[RELEASE]"* || "$COMMIT_MSG" == *"[release]"* ]]; then
            echo "Found [RELEASE] keyword in commit message."
            SHOULD_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_release }}" == "true" ]]; then
            echo "Release forced via workflow dispatch."
            SHOULD_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.specific_version }}" != "" ]]; then
            echo "Release triggered with specific version via workflow dispatch."
            SHOULD_RELEASE="true"
          else
            echo "No [RELEASE] keyword found and not a forced dispatch. Standard CI run."
          fi
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Calculate New Version
        id: calculate_version
        # Only run if we determined a release should happen OR if a specific version is provided
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_VERSION=$(date +'%Y.%m.%d')
          AUTO_VERSION="${DATE_VERSION}-${SHORT_SHA}"

          NEW_VERSION="$AUTO_VERSION" # Default to auto-version

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.specific_version }}" != "" ]]; then
            echo "Using specific version from input: ${{ github.event.inputs.specific_version }}"
            NEW_VERSION="${{ github.event.inputs.specific_version }}"
          else
            echo "Using auto-generated version: $AUTO_VERSION"
          fi

          echo "New version calculated: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  # Job 2: Run standard CI checks (tests, lint, format)
  ci-checks:
    name: CI Checks (Test, Lint, Format)
    runs-on: ${{ matrix.os }}
    needs: determine-version # Ensure version determination runs first, though not strictly dependent for CI logic
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ env.RUST_VERSION }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglib2.0-dev libgtk-3-dev

      - name: Check formatting (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run clippy (all OS)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (all OS, all features)
        run: cargo build --verbose --all-features

      - name: Run tests (all OS, all features)
        run: cargo test --verbose --all-features

  # Job 3: Build release binaries for various platforms
  build-release-binaries:
    name: Build for ${{ matrix.target_os }}-${{ matrix.target_arch }}
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, ci-checks]
    if: |
      needs.ci-checks.result == 'success' &&
      (needs.determine-version.outputs.should_release == 'true' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            target_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name_suffix: linux-x86_64
            binary_name: copydvd
            use_cross: false
          - target_os: linux
            target_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact_name_suffix: linux-aarch64
            binary_name: copydvd
            use_cross: true
          - target_os: macos
            target_arch: x86_64
            rust_target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name_suffix: macos-x86_64
            binary_name: copydvd
            use_cross: false
          - target_os: macos
            target_arch: arm64
            rust_target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name_suffix: macos-aarch64
            binary_name: copydvd
            use_cross: false
          - target_os: windows
            target_arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact_name_suffix: windows-x86_64
            binary_name: copydvd.exe
            use_cross: false
          - target_os: windows
            target_arch: arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-latest
            artifact_name_suffix: windows-aarch64
            binary_name: copydvd.exe
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ env.RUST_VERSION }}) with target ${{ matrix.rust_target }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache for target ${{ matrix.rust_target }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Install Linux dependencies (for native Linux builds)
        if: matrix.runner == 'ubuntu-latest' && matrix.use_cross == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglib2.0-dev libgtk-3-dev

      - name: Install cross-rs (for cross-compilation)
        if: matrix.use_cross == 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Pre-pull Docker image for ARM Linux cross-compilation
        if: matrix.use_cross == 'true' && matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "Pre-pulling Docker image for ARM Linux cross-compilation..."
          cross --version
          cross-util pre-pull --target ${{ matrix.rust_target }}

      - name: Build Binary
        id: build_binary
        shell: bash
        run: |
          BUILD_COMMAND="cargo"
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            BUILD_COMMAND="cross"
          fi

          echo "Building with: $BUILD_COMMAND for target ${{ matrix.rust_target }}"

          if $BUILD_COMMAND build --release --target ${{ matrix.rust_target }} --all-features --verbose; then
            echo "✅ Full feature build successful for ${{ matrix.rust_target }}"
            echo "build_type=full" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.rust_target }}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "⚠️ Full feature build failed for ARM Linux, attempting CLI-only build..."
            cargo clean --target ${{ matrix.rust_target }} || true
            if $BUILD_COMMAND build --release --target ${{ matrix.rust_target }} --no-default-features --verbose; then
              echo "✅ CLI-only build successful for ${{ matrix.rust_target }}"
              echo "build_type=cli-only" >> $GITHUB_OUTPUT
            else
              echo "❌ Both full and CLI-only builds failed for ARM Linux."
              exit 1
            fi
          else
            echo "❌ Build failed for ${{ matrix.rust_target }}"
            exit 1
          fi

          EXPECTED_BINARY_PATH="target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}"
          if [ -f "$EXPECTED_BINARY_PATH" ]; then
            echo "✅ Binary found at $EXPECTED_BINARY_PATH"
            ls -la "$EXPECTED_BINARY_PATH"
            file "$EXPECTED_BINARY_PATH"
            echo "binary_path=$EXPECTED_BINARY_PATH" >> $GITHUB_OUTPUT
          else
            echo "❌ Binary NOT found at $EXPECTED_BINARY_PATH after build!"
            echo "Contents of target/${{ matrix.rust_target }}/release/:"
            ls -la target/${{ matrix.rust_target }}/release/ || echo "Release directory not found."
            exit 1
          fi

      - name: Strip binary (Unix-like only)
        if: steps.build_binary.outputs.binary_path != '' && (matrix.runner == 'ubuntu-latest' || matrix.runner == 'macos-latest')
        run: strip ${{ steps.build_binary.outputs.binary_path }}

      - name: Upload Artifact
        if: steps.build_binary.outputs.binary_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: copydvd-${{ matrix.artifact_name_suffix }}
          path: ${{ steps.build_binary.outputs.binary_path }}

  # Job 4: Create GitHub Release and upload assets
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-release-binaries]
    if: |
      needs.determine-version.outputs.should_release == 'true' &&
      (needs.build-release-binaries.result == 'success' || needs.build-release-binaries.result == 'skipped')
    permissions:
      contents: write
    outputs:
      release_upload_url: ${{ steps.create_release_step.outputs.upload_url }}
      release_tag: ${{ steps.create_release_step.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Important: Use a token that can push to the repository for Cargo.toml updates
          token: ${{ secrets.GITHUB_TOKEN }} # Or a PAT with repo write scope if GITHUB_TOKEN isn't enough for pushes

      - name: Get New Version
        id: version_info
        run: echo "new_version=${{ needs.determine-version.outputs.new_version }}" >> $GITHUB_OUTPUT

      - name: Update Cargo.toml and Cargo.lock
        id: update_cargo_files
        if: needs.determine-version.outputs.should_release == 'true' # Ensure this only runs on release intent
        run: |
          NEW_VERSION="${{ needs.determine-version.outputs.new_version }}"
          echo "Updating Cargo.toml to version $NEW_VERSION"
          # Using a more robust sed command that works on macOS (GitHub runners) and Linux
          sed -i.bak -E "s/^version\s*=\s*\"[0-9A-Za-z.-]+\"/version = \"$NEW_VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "Cargo.toml updated."

          echo "Running cargo check to update Cargo.lock if necessary..."
          cargo check --verbose # This will update Cargo.lock if the version change implies it
          echo "Cargo.lock potentially updated."

          # Check if files were actually changed
          if git diff --quiet Cargo.toml && git diff --quiet Cargo.lock; then
            echo "No changes to Cargo.toml or Cargo.lock. Skipping commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Cargo.toml or Cargo.lock changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Commit and Push Cargo.toml Changes
        if: steps.update_cargo_files.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          COMMIT_MSG="chore(release): Update Cargo files to version ${{ needs.determine-version.outputs.new_version }} [skip ci]"
          git commit -m "$COMMIT_MSG"
          echo "Pushing Cargo.toml & Cargo.lock changes to branch ${{ github.ref_name }}"
          # Use a loop with retry for the push, as sometimes there can be race conditions
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && break # Push to the current branch
            echo "Push attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done || echo "Failed to push Cargo file updates after multiple retries."
        shell: bash

      - name: Generate "What's New" Changelog
        id: changelog
        run: |
          echo "Generating changelog..."
          LATEST_EXISTING_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Latest existing tag (or first commit): $LATEST_EXISTING_TAG"

          COMMITS_LOG=$(git log $LATEST_EXISTING_TAG..HEAD --pretty="format:- %s (%h) by %an" --no-merges)

          if [ -z "$COMMITS_LOG" ]; then
            COMMITS_LOG="No specific changes listed for this build. Likely a forced release or first release."
          fi

          CHANGELOG_BODY="## What's New in Version ${{ steps.version_info.outputs.new_version }}

          $COMMITS_LOG

          ---
          **Build Information:**
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          **Supported Platforms (Binaries attached if build succeeded):**
          - Linux (x86_64, aarch64)
          - macOS (x86_64, aarch64)
          - Windows (x86_64, aarch64)

          *Note: ARM Linux and Windows ARM builds are best-effort. If an artifact is missing, the build for that platform may have encountered issues. Check the build logs for details.*
          "

          echo "Generated Changelog Body:"
          echo "$CHANGELOG_BODY"

          CHANGELOG_BODY="${CHANGELOG_BODY//'%'/'%25'}"
          CHANGELOG_BODY="${CHANGELOG_BODY//$'\n'/'%0A'}"
          CHANGELOG_BODY="${CHANGELOG_BODY//$'\r'/'%0D'}"

          echo "changelog_text=$CHANGELOG_BODY" >> $GITHUB_OUTPUT

      - name: Create Release Tag and GitHub Release
        id: create_release_step
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version_info.outputs.new_version }}
          release_name: CopyDVD ${{ steps.version_info.outputs.new_version }}
          body: ${{ steps.changelog.outputs.changelog_text }}
          draft: false
          prerelease: ${{ contains(steps.version_info.outputs.new_version, 'alpha') || contains(steps.version_info.outputs.new_version, 'beta') || contains(steps.version_info.outputs.new_version, 'rc') }}
          # The commitish should ideally be the commit that was just pushed with Cargo.toml changes.
          # However, actions/create-release defaults to the commit the workflow is running on (github.sha),
          # which should be correct if the push step completed successfully before this.

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List downloaded artifacts
        run: ls -R release-artifacts/

      - name: Upload Release Assets
        shell: bash
        run: |
          UPLOAD_URL="${{ steps.create_release_step.outputs.upload_url }}"
          if [ -z "$UPLOAD_URL" ]; then
            echo "Error: Release upload URL is empty. Cannot upload assets."
            TAG_NAME="v${{ steps.version_info.outputs.new_version }}"
            echo "Attempting to find existing release for tag $TAG_NAME"
            RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                               -H "Accept: application/vnd.github.v3+json" \
                               "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME")
            UPLOAD_URL=$(echo "$RELEASE_INFO" | jq -r .upload_url | sed 's/{?name,label}//')

            if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" == "null" ]; then
               echo "Could not find existing release or upload URL for tag $TAG_NAME. Skipping asset upload."
               exit 0
            else
               echo "Found existing release upload URL: $UPLOAD_URL"
            fi
          fi

          shopt -s nullglob
          for ARTIFACT_DIR in release-artifacts/*/; do
            if [ -d "$ARTIFACT_DIR" ]; then
              ARTIFACT_NAME=$(basename "$ARTIFACT_DIR")
              echo "Processing artifact directory: $ARTIFACT_NAME"
              BINARY_FILE=$(find "$ARTIFACT_DIR" -type f -print -quit)
              if [ -f "$BINARY_FILE" ]; then
                ASSET_NAME=$(basename "$BINARY_FILE")
                echo "Uploading $ASSET_NAME from $BINARY_FILE to $UPLOAD_URL"
                gh release upload "v${{ steps.version_info.outputs.new_version }}" "$BINARY_FILE" --clobber
              else
                echo "Warning: No binary file found in artifact directory $ARTIFACT_DIR"
              fi
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Notify completion
  notify-completion:
    name: Notify Release Completion
    runs-on: ubuntu-latest
    needs: [determine-version, create-github-release]
    if: always() && needs.determine-version.outputs.should_release == 'true'
    steps:
      - name: Send Notification
        run: |
          echo "🚀 Release Process for CopyDVD Version: ${{ needs.determine-version.outputs.new_version }} Summary 🚀"
          echo "-----------------------------------------------------"
          if [[ "${{ needs.create-github-release.result }}" == "success" ]]; then
            echo "✅ GitHub Release successfully created/updated for tag: ${{ needs.create-github-release.outputs.release_tag }}"
            echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-github-release.outputs.release_tag }}"
            echo "📦 Assets should be uploaded if builds were successful."
          elif [[ "${{ needs.create-github-release.result }}" == "skipped" ]]; then
            echo "ℹ️ Release creation was skipped. This might be because the tag already existed or conditions weren't met."
            echo "Tag that would have been used: v${{ needs.determine-version.outputs.new_version }}"
          else
            echo "❌ GitHub Release creation failed. Status: ${{ needs.create-github-release.result }}"
            echo "Tag that was attempted: v${{ needs.determine-version.outputs.new_version }}"
          fi
          echo "-----------------------------------------------------"
          echo "Build Status (check individual build jobs for details):"
          echo "Job 'build-release-binaries' status: ${{ needs.build-release-binaries.result || 'Not Run' }}"
          echo "-----------------------------------------------------"
          echo "Please check the GitHub Actions logs and the Releases page for full details."

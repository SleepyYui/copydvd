name: Build and Release

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglib2.0-dev libgtk-3-dev
      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: copydvd
            asset_name: copydvd-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: copydvd
            asset_name: copydvd-linux-aarch64

          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: copydvd
            asset_name: copydvd-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: copydvd
            asset_name: copydvd-macos-aarch64

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: copydvd.exe
            asset_name: copydvd-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglib2.0-dev libgtk-3-dev

      - name: Install cross for ARM compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release
        shell: bash
        run: |
          set -e
          
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "Building ARM Linux with cross..."
            cross build --release --target ${{ matrix.target }} --all-features --verbose
          else
            echo "Building ${{ matrix.target }} with cargo..."
            cargo build --release --target ${{ matrix.target }} --all-features --verbose
          fi
          
          # Verify the binary was created
          echo "Checking for binary at: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" ]; then
            echo "✓ Binary created successfully: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
            ls -la "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          else
            echo "✗ Binary NOT found at: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
            echo "Contents of target/${{ matrix.target }}/release/:"
            ls -la "target/${{ matrix.target }}/release/" 2>/dev/null || echo "Release directory doesn't exist"
            echo "All files in target/${{ matrix.target }}/release/:"
            find "target/${{ matrix.target }}/release/" -type f 2>/dev/null || echo "No files found"
            echo "Debug: Expected binary name from matrix: ${{ matrix.artifact_name }}"
            echo "Debug: Looking for files with similar names:"
            find "target/${{ matrix.target }}/release/" -name "*copy*" -o -name "*dvd*" 2>/dev/null || echo "No similar files found"
            exit 1
          fi

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" ]; then
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
            echo "✓ Binary stripped successfully"
          else
            echo "✗ Binary not found at target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        continue-on-error: false

      - name: Mark build as successful
        if: success()
        run: echo "BUILD_SUCCESS=true" >> $GITHUB_ENV

      - name: Mark build as failed  
        if: failure()
        run: |
          echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
          echo "Build failed for target: ${{ matrix.target }}"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/v2' && github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest tag
        id: latest_tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          if [[ -n "${{ steps.latest_tag.outputs.latest_tag }}" ]]; then
            COMMITS=$(git log ${{ steps.latest_tag.outputs.latest_tag }}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          CHANGELOG="## What's Changed

          $COMMITS

          ## Build Information
          - Built from commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## Supported Platforms
          The following platforms are targeted for this release:
          - Linux (x86_64, aarch64)
          - macOS (Intel, Apple Silicon)  
          - Windows (x86_64)

          **Note:** Successfully built platforms will have their binaries attached to this release. If any builds failed, they will not appear in the assets list below. Please check the Actions tab for detailed build information.

          ## Installation
          Download the appropriate binary for your platform and make it executable (Linux/macOS):
          \`\`\`bash
          chmod +x copydvd-*
          \`\`\`

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.latest_tag.outputs.latest_tag }}...v${{ steps.version.outputs.version }}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          release_name: DVD Ripper ${{ steps.version.outputs.tag_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [create-release, build]
    if: github.ref == 'refs/heads/v2' && github.event_name == 'push' && always()
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        asset:
          - name: copydvd-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - name: copydvd-linux-aarch64
            target: aarch64-unknown-linux-gnu
          - name: copydvd-macos-x86_64
            target: x86_64-apple-darwin
          - name: copydvd-macos-aarch64
            target: aarch64-apple-darwin
          - name: copydvd-windows-x86_64.exe
            target: x86_64-pc-windows-msvc

    steps:
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.asset.name }}
          path: ./

      - name: Verify downloaded artifact
        if: steps.download.outcome == 'success'
        run: |
          echo "✓ Successfully downloaded artifact: ${{ matrix.asset.name }}"
          ls -la ./${{ matrix.asset.name }} || ls -la ./
          
      - name: Upload Release Asset
        if: steps.download.outcome == 'success'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.asset.name }}
          asset_name: ${{ matrix.asset.name }}
          asset_content_type: application/octet-stream

      - name: Report successful upload
        if: steps.download.outcome == 'success'
        run: echo "✅ Successfully uploaded ${{ matrix.asset.name }} to release"

      - name: Report missing asset
        if: steps.download.outcome == 'failure'
        run: |
          echo "⚠️ Asset ${{ matrix.asset.name }} was not available for upload"
          echo "This indicates the build for target ${{ matrix.asset.target }} failed during the build stage"
          echo "The release will continue without this platform's binary"

  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [create-release, build, upload-assets]
    if: github.ref == 'refs/heads/v2' && github.event_name == 'push' && always()

    steps:
      - name: Completion notification
        run: |
          echo "🎉 Release ${{ needs.create-release.outputs.tag_name }} processing completed!"
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All builds completed successfully"
          else
            echo "⚠️ Some builds may have failed - check individual platform results"
          fi
          if [[ "${{ needs.upload-assets.result }}" == "success" ]]; then
            echo "📦 Available platform binaries have been uploaded"
          else
            echo "⚠️ Some assets may not have been uploaded due to build failures"
          fi
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.tag_name }}"
          echo "📋 Check the release notes for information about which platforms built successfully"

name: Release

on:
  push:
    branches: [ v2 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ v2 ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-suffix: ""
            installer: false
          - os: ubuntu-latest  
            target: aarch64-unknown-linux-gnu
            binary-suffix: ""
            installer: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-suffix: ".exe"
            installer: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary-suffix: ""
            installer: true
          - os: macos-latest
            target: aarch64-apple-darwin  
            binary-suffix: ""
            installer: true

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools (Linux)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Install Linux dependencies  
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

    - name: Build
      run: |
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
        fi
        cargo build --release --target ${{ matrix.target }}

    - name: Create App Bundle (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x create_app_bundle.sh
        ./create_app_bundle.sh ${{ matrix.target }}

    - name: Create Windows Installer
      if: matrix.installer && runner.os == 'Windows'
      shell: pwsh
      run: |
        .\create_windows_installer.ps1 -Target ${{ matrix.target }}

    - name: Create Linux Installer
      if: matrix.installer && runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        chmod +x create_linux_installer.sh
        ./create_linux_installer.sh ${{ matrix.target }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: copydvd-${{ matrix.target }}
        path: |
          target/${{ matrix.target }}/release/copydvd${{ matrix.binary-suffix }}
          Copy DVD.app/
          installer-windows/
          installer-linux/
        if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          copydvd-*/copydvd*
          copydvd-*/Copy DVD.app/
          copydvd-*/installer-windows/
          copydvd-*/installer-linux/
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
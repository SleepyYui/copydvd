name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Specific platform to build (optional)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'x86_64-unknown-linux-gnu'
          - 'aarch64-unknown-linux-gnu'
          - 'x86_64-apple-darwin'
          - 'aarch64-apple-darwin'
          - 'x86_64-pc-windows-msvc'
      skip_release:
        description: 'Skip release creation (test builds only)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build info
        shell: bash
        run: |
          echo "🏗️ Building for target: ${{ matrix.target }}"
          echo "📦 Asset name: ${{ matrix.asset_name }}"
          echo "🖥️ Running on: ${{ matrix.os }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🔧 Manual dispatch - Target filter: ${{ github.event.inputs.target_platform || 'all' }}"
            echo "🚫 Skip release: ${{ github.event.inputs.skip_release || 'false' }}"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglib2.0-dev libgtk-3-dev
      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: copydvd
            asset_name: copydvd-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: copydvd
            asset_name: copydvd-linux-aarch64

          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: copydvd
            asset_name: copydvd-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: copydvd
            asset_name: copydvd-macos-aarch64

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: copydvd.exe
            asset_name: copydvd-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglib2.0-dev libgtk-3-dev

      - name: Install cross for ARM compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          
      - name: Pre-pull Docker image for ARM compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "Pre-pulling Docker image for ARM cross-compilation..."
          # Try to pull the image, but don't fail if it doesn't work
          docker pull ghcr.io/cross-rs/cross:aarch64-unknown-linux-gnu || \
          docker pull crossrs/cross:aarch64-unknown-linux-gnu || \
          echo "Warning: Could not pre-pull Docker image, cross will try to pull it during build"

      - name: Build release
        shell: bash
        continue-on-error: true
        id: build
        env:
          CROSS_NO_WARNINGS: "0"
        run: |
          set -e
          
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "Building ARM Linux with cross..."
            
            # Try building with cross, with retry logic and fallback strategies
            BUILD_SUCCESS=false
            
            # Strategy 1: Try full GUI build with rustls
            echo "🔧 Strategy 1: Building with full GUI features and rustls backend..."
            if timeout 900 cross build --release --target ${{ matrix.target }} --all-features --verbose; then
              BUILD_SUCCESS=true
              echo "✅ ARM Linux build succeeded with full features"
            else
              echo "❌ Strategy 1 failed, cleaning and trying CLI-only build..."
              cargo clean --target ${{ matrix.target }} || true
              
              # Strategy 2: CLI-only build (no GUI dependencies)
              echo "🔧 Strategy 2: Building CLI-only version (no GUI dependencies)..."
              if timeout 600 cross build --release --target ${{ matrix.target }} --no-default-features --verbose; then
                BUILD_SUCCESS=true
                echo "✅ ARM Linux build succeeded with CLI-only features"
                echo "⚠️ Note: ARM Linux binary will be CLI-only due to GUI cross-compilation limitations"
                echo "ℹ️ CLI version includes all core DVD ripping functionality"
              else
                echo "❌ Strategy 2 failed, trying with minimal core features..."
                cargo clean --target ${{ matrix.target }} || true
                
                # Strategy 3: Absolute minimal build
                echo "🔧 Strategy 3: Building with absolute minimal features..."
                if timeout 300 cross build --release --target ${{ matrix.target }} --no-default-features --bin copydvd --verbose; then
                  BUILD_SUCCESS=true
                  echo "✅ ARM Linux build succeeded with minimal features"
                  echo "⚠️ Note: ARM Linux binary has minimal feature set"
                else
                  echo "❌ All ARM Linux build strategies failed"
                  echo "🔧 Possible causes:"
                  echo "   - Cross-compilation container issues"
                  echo "   - Network connectivity problems"
                  echo "   - Incompatible system dependencies"
                  echo "   - Architecture-specific compilation errors"
                fi
              fi
            fi
            
            if [ "$BUILD_SUCCESS" = false ]; then
              echo "❌ ARM Linux build failed with all strategies"
              echo "🔧 Common causes:"
              echo "  - Docker image unavailable or corrupted"
              echo "  - Cross-compilation environment issues"
              echo "  - Missing system dependencies"
              echo "  - Network connectivity problems"
              echo "📋 The release will continue without ARM Linux binary"
              echo "🔗 Check https://github.com/cross-rs/cross for cross-compilation troubleshooting"
              exit 1
            fi
          else
            echo "Building ${{ matrix.target }} with cargo..."
            cargo build --release --target ${{ matrix.target }} --all-features --verbose
          fi
          
          # Comprehensive binary verification and debugging
          echo "🔍 Checking for binary at: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          echo "🎯 Expected binary name: ${{ matrix.artifact_name }}"
          echo "🎯 Target: ${{ matrix.target }}"
          
          # Show target directory structure
          echo "📁 Target directory structure:"
          ls -la "target/" 2>/dev/null || echo "Target directory doesn't exist"
          
          if [ -d "target/${{ matrix.target }}" ]; then
            echo "📁 Target-specific directory contents:"
            ls -la "target/${{ matrix.target }}/" 2>/dev/null
            
            if [ -d "target/${{ matrix.target }}/release" ]; then
              echo "📁 Release directory contents:"
              ls -la "target/${{ matrix.target }}/release/" 2>/dev/null
              
              echo "🔍 All files in release directory:"
              find "target/${{ matrix.target }}/release/" -type f 2>/dev/null | head -20
              
              echo "🔍 Looking for binaries (executable files):"
              find "target/${{ matrix.target }}/release/" -type f -executable 2>/dev/null | head -10
              
              echo "🔍 Looking for files with 'copy' or 'dvd' in name:"
              find "target/${{ matrix.target }}/release/" -name "*copy*" -o -name "*dvd*" 2>/dev/null
            else
              echo "❌ Release directory doesn't exist"
            fi
          else
            echo "❌ Target directory doesn't exist"
          fi
          
          # Final binary check
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" ]; then
            echo "✅ Binary found: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
            ls -la "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
            file "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          else
            echo "❌ Binary NOT found at expected location"
            echo "🔧 This indicates the build may have failed silently or the binary name is different"
            
            # Try to find any binary that might be ours
            echo "🔍 Searching for any potential binary:"
            find "target/" -name "*copy*" -o -name "*dvd*" 2>/dev/null | head -10
            
            if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
              echo "⚠️ ARM Linux cross-compilation may have failed"
              echo "🔧 This is often due to missing dependencies or cross-compilation issues"
              exit 1
            else
              exit 1
            fi
          fi

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest' && steps.build.outcome == 'success'
        shell: bash
        run: |
          echo "🔧 Attempting to strip binary: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" ]; then
            echo "✅ Binary exists, proceeding with strip"
            strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
            echo "✅ Binary stripped successfully"
            ls -la "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          else
            echo "❌ Binary not found for stripping: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
            echo "🔍 Available files in release directory:"
            ls -la "target/${{ matrix.target }}/release/" 2>/dev/null || echo "No release directory"
            exit 1
          fi

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Mark build as successful
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          echo "✅ Build succeeded for target: ${{ matrix.target }}"

      - name: Mark build as failed  
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
          echo "❌ Build failed for target: ${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "ARM Linux builds often fail due to Docker image or dependency issues"
            echo "This is a known limitation and the release will continue with other platforms"
          fi

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest tag
        id: latest_tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          if [[ -n "${{ steps.latest_tag.outputs.latest_tag }}" ]]; then
            COMMITS=$(git log ${{ steps.latest_tag.outputs.latest_tag }}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          CHANGELOG="## What's Changed

          $COMMITS

          ## Build Information
          - Built from commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## Supported Platforms
          The following platforms are targeted for this release:
          - Linux x86_64 (Intel/AMD 64-bit)
          - Linux aarch64 (ARM 64-bit) - *May fail due to cross-compilation issues*
          - macOS x86_64 (Intel Mac)
          - macOS aarch64 (Apple Silicon)
          - Windows x86_64 (64-bit)

          **Build Status:** Successfully built platforms will have their binaries attached below. If any builds failed (especially ARM Linux), they will not appear in the assets list. This is often due to Docker image availability or cross-compilation dependency issues. Check the [Actions tab](../../actions) for detailed build logs.

          ## Installation
          Download the appropriate binary for your platform and make it executable (Linux/macOS):
          \`\`\`bash
          chmod +x copydvd-*
          \`\`\`

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.latest_tag.outputs.latest_tag }}...v${{ steps.version.outputs.version }}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          release_name: DVD Ripper ${{ steps.version.outputs.tag_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [create-release, build]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && needs.create-release.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        asset:
          - name: copydvd-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - name: copydvd-linux-aarch64
            target: aarch64-unknown-linux-gnu
          - name: copydvd-macos-x86_64
            target: x86_64-apple-darwin
          - name: copydvd-macos-aarch64
            target: aarch64-apple-darwin
          - name: copydvd-windows-x86_64.exe
            target: x86_64-pc-windows-msvc

    steps:
      - name: Debug upload URL
        shell: bash
        run: |
          echo "Upload URL: ${{ needs.create-release.outputs.upload_url }}"
          echo "Tag name: ${{ needs.create-release.outputs.tag_name }}"
          
      - name: Download artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.asset.name }}
          path: ./

      - name: Verify downloaded artifact
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          echo "✓ Successfully downloaded artifact: ${{ matrix.asset.name }}"
          ls -la ./${{ matrix.asset.name }} || ls -la ./
          
      - name: Upload Release Asset
        if: steps.download.outcome == 'success'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.asset.name }}
          asset_name: ${{ matrix.asset.name }}
          asset_content_type: application/octet-stream

      - name: Report successful upload
        if: steps.download.outcome == 'success'
        shell: bash
        run: echo "✅ Successfully uploaded ${{ matrix.asset.name }} to release"

      - name: Report missing asset
        if: steps.download.outcome == 'failure'
        shell: bash
        run: |
          echo "⚠️ Asset ${{ matrix.asset.name }} was not available for upload"
          echo "This indicates the build for target ${{ matrix.asset.target }} failed during the build stage"
          if [[ "${{ matrix.asset.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "ARM Linux builds commonly fail due to Docker cross-compilation issues"
            echo "This is a known limitation and users can try building locally if needed"
          fi
          echo "The release will continue without this platform's binary"

  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [create-release, build, upload-assets]
    if: github.ref == 'refs/heads/v2' && github.event_name == 'push' && (needs.create-release.result == 'success' || needs.create-release.result == 'failure')

    steps:
      - name: Completion notification
        shell: bash
        run: |
          echo "🎉 Release ${{ needs.create-release.outputs.tag_name }} processing completed!"
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All builds completed successfully"
          else
            echo "⚠️ Some builds may have failed - check individual platform results"
          fi
          if [[ "${{ needs.upload-assets.result }}" == "success" ]]; then
            echo "📦 Available platform binaries have been uploaded"
          else
            echo "⚠️ Some assets may not have been uploaded due to build failures"
          fi
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.tag_name }}"
          echo "📋 Check the release notes for information about which platforms built successfully"

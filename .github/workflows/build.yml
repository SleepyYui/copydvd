name: Build Binaries

on:
  push:
    branches: [v2]
  workflow_run:
    workflows: ["Code Quality"]
    types: [completed]
    branches: [v2]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: copydvd
            use_cross: false
            features: "--all-features"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: copydvd
            use_cross: false
            features: "--all-features"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: copydvd
            use_cross: false
            features: "--all-features"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: copydvd.exe
            use_cross: false
            features: "--all-features"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglib2.0-dev libglib2.0-dev-bin libgtk-3-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev

      - name: Build binary
        shell: bash
        run: |
          echo "Building: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}"
          cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}
          
          BINARY_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [[ ! -f "$BINARY_PATH" ]]; then
            echo "❌ Binary not found at $BINARY_PATH"
            exit 1
          fi
          
          echo "✅ Binary built successfully: $BINARY_PATH"
          ls -la "$BINARY_PATH"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 30